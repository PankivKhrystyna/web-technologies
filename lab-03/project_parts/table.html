<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; }
    table { border-collapse: collapse; }
    td { width: 50px; height: 50px; border: 2px solid black; }
    .c1 { background: #2bffd0; }
    .c2 { background: #fffdd0; }
    .red { background: #ff1212; }
    .blue { background: blue; }
    .green { background: lime; }
    .yellow { background: yellow; }
  </style>
</head>
<body>
  <table>
    <tr><td colspan="8" class="c1"></td></tr>
    <tr><td rowspan="6" class="c2"></td><td colspan="6" class="c1"></td><td rowspan="6" class="c2"></td></tr>
    <tr><td rowspan="4" class="c2"></td><td colspan="4" class="c1"></td><td rowspan="4" class="c2"></td></tr>
    <tr><td rowspan="2" class="c2"></td><td class="red"></td><td class="blue"></td><td rowspan="2" class="c2"></td></tr>
    <tr><td class="green"></td><td class="yellow"></td></tr>
    <tr><td colspan="4" class="c1"></td></tr>
    <tr><td colspan="6" class="c1"></td></tr>
    <tr><td colspan="8" class="c1"></td></tr>
  </table>
  <br>
  <a href="../index.html">Повернутись на головну</a>
</body>
</html>
